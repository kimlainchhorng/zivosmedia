        if(loaded)return; loaded=true;

          gtag('js',new Date());

            gtag('config',gaId,{send_page_view:true});
          }
          if(marketingAllowed&&googleAdsId){
            gtag('config',googleAdsId,{send_page_view:false});
          }
        }
        if(marketingAllowed){
          // Meta Pixel
          var metaId=metaContent('zivo-meta-pixel');
          if(metaId){
            !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};

            fbq('init',metaId);fbq('track','PageView');

          // TikTok Pixel

          if(ttId){
            !function(w,d,t){w.TiktokAnalyticsObject=t;var ttq=w[t]=w[t]||[];ttq.methods=["page","track","identify","instances","debug","on","off","once","ready","alias","group","enableCookie","disableCookie","holdConsent","revokeConsent","grantConsent"],ttq.setAndDefer=function(t,e){t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}};for(var i=0;i<ttq.methods.length;i++)ttq.setAndDefer(ttq,ttq.methods[i]);ttq.instance=function(t){for(var e=ttq._i[t]||[],n=0;n<ttq.methods.length;n++)ttq.setAndDefer(e,ttq.methods[n]);return e},ttq.load=function(e,n){var r="https://analytics.tiktok.com/i18n/pixel/events.js",o=n&&n.partner;ttq._i=ttq._i||{},ttq._i[e]=[],ttq._i[e]._u=r,ttq._t=ttq._t||{},ttq._t[e]=+new Date,ttq._o=ttq._o||{},ttq._o[e]=n||{};var s=document.createElement("script");s.type="text/javascript",s.async=!0,s.src=r+"?sdkid="+e+"&lib="+t;var a=document.getElementsByTagName("script")[0];a.parentNode.insertBefore(s,a)};

    <!-- Deferred non-critical third-party tracker (idle, web only, flight-related routes only) -->
    <script>
      (function () {
        if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) return;
        // Only load on flight-related routes where the partner script is relevant.
        // Excluded from "/" to keep the home screen lighter and smoother.
        var path = location.pathname || '';
        var isFlightRoute = path.indexOf('/flight') === 0 || path.indexOf('/hotel') === 0 || path.indexOf('/car') === 0;
        if (!isFlightRoute) return;
        function load(){
          var script = document.createElement("script");
          script.async = 1;
          script.src = 'https://emrld.ltd/NDkzNzQ1.js?t=493745';
          script.onerror = function () {};
          document.head.appendChild(script);
        }
        function schedule(){
          if ('requestIdleCallback' in window) requestIdleCallback(load, { timeout: 10000 });
          else setTimeout(load, 6000);
        }
        if (document.readyState === 'complete') setTimeout(schedule, 2000);
        else window.addEventListener('load', function(){ setTimeout(schedule, 2000); }, { once: true });
      })();
    </script>
