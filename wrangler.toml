name = "zivo"
main = "cloudflare/worker.ts"
compatibility_date = "2026-05-23"
workers_dev = true
preview_urls = false

[[routes]]
pattern = "zivosoftware.com/*"
zone_name = "zivosoftware.com"

[[routes]]
pattern = "www.zivosoftware.com/*"
zone_name = "zivosoftware.com"

[[routes]]
pattern = "zivostravel.com/*"
zone_name = "zivostravel.com"

[[routes]]
pattern = "www.zivostravel.com/*"
zone_name = "zivostravel.com"

# When the built Vite app is deployed to Cloudflare Workers, unknown routes
# are served from index.html so React Router deep links work.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
ALLOWED_ORIGINS = "https://zivosmedia.com,https://www.zivosmedia.com,https://zivoschat.com,https://www.zivoschat.com,https://zivosoftware.com,https://www.zivosoftware.com,https://zivobusiness.com,https://www.zivobusiness.com,https://zivodriver.com,https://www.zivodriver.com,https://zivoemployee.com,https://www.zivoemployee.com,https://zivostravel.com,https://www.zivostravel.com,https://app.zivosmedia.com,https://preview.zivosmedia.com,https://myzivo.com,https://www.myzivo.com,https://app.myzivo.com,https://preview.myzivo.com,https://zivo.myzivo.workers.dev,https://zivo-web.myzivo.workers.dev,http://localhost:8081,http://localhost:5173"

[[r2_buckets]]
binding = "ZIVO_MEDIA"
bucket_name = "zivo-media"
preview_bucket_name = "zivo-media-dev"
