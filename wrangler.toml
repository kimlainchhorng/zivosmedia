name = "zivo-web"
main = "cloudflare/worker.ts"
compatibility_date = "2026-05-23"
workers_dev = true
preview_urls = false

# When the built Vite app is deployed to Cloudflare Workers, unknown routes
# are served from index.html so React Router deep links work.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/media/*", "/downloads/*", "/share/c/*", "/healthz"]

[vars]
ALLOWED_ORIGINS = "https://zivollc.com,https://www.zivollc.com,https://app.zivollc.com,https://preview.zivollc.com,https://myzivo.com,https://www.myzivo.com,https://app.myzivo.com,https://preview.myzivo.com,https://zivo-web.myzivo.workers.dev,http://localhost:8081,http://localhost:5173"

[[r2_buckets]]
binding = "ZIVO_MEDIA"
bucket_name = "zivo-media"
preview_bucket_name = "zivo-media-dev"
