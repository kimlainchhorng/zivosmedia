<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <!-- Strict CSP: no scripts/styles/fetch/img beyond this origin. Guarantees the
       Review build cannot reach production Supabase or any network target. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; connect-src 'none'; frame-ancestors 'none'" />
  <title>ZIVO Media — Review (Demo data only)</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="rv-envbar" role="banner">
    <div class="rv-envbar__row">
      <span class="rv-badge rv-badge--env">Environment: Review</span>
      <span class="rv-badge rv-badge--demo">Demo data only</span>
      <span class="rv-badge rv-badge--off">Actions disabled</span>
    </div>
    <div class="rv-envbar__meta">
      <span>SHA: <code id="rv-sha">unknown</code></span>
      <span>Built: <code id="rv-built">unknown</code></span>
    </div>
  </header>

  <nav class="rv-nav" id="rv-nav" aria-label="Review snapshots"></nav>
  <main class="rv-main" id="rv-main" aria-live="polite"></main>

  <footer class="rv-foot">
    Isolated Review build — deterministic fictional fixtures only. No authentication, no
    production data, no network calls, no mutations. Every control is disabled.
  </footer>

  <!-- Injected at build time (SHA + timestamp). No secrets, no env, no keys. -->
  <script src="./config.js"></script>
  <script src="./fixtures.js"></script>
  <script src="./app.js"></script>
</body>
</html>
