name: Notifications Smoke

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "src/hooks/usePushNotifications.ts"
      - ".github/workflows/notifications-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "src/hooks/usePushNotifications.ts"
      - ".github/workflows/notifications-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notifications-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Notification stack smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DENO_DIR: ~/.cache/deno

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-notifications-${{ hashFiles('supabase/functions/**/*.ts', 'supabase/functions/**/*.json', 'supabase/config.toml') }}
          restore-keys: |
            ${{ runner.os }}-deno-notifications-

      - name: Verify notification functions compile
        run: |
          deno check --config supabase/functions/deno.json supabase/functions/notify-dispatch/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/register-push-token/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/send-marketing-campaign/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/send-push-notification/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/send-transactional-email/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/send-sms/index.ts

      - name: Verify notification config entries
        run: |
          grep -q '\[functions.notify-dispatch\]' supabase/config.toml
          grep -q '\[functions.register-push-token\]' supabase/config.toml
          grep -q '\[functions.send-sms\]' supabase/config.toml
          grep -q '\[functions.send-transactional-email\]' supabase/config.toml

      - name: Lint notification edge functions
        run: deno lint --config supabase/functions/deno.json --rules-exclude=no-explicit-any,no-import-prefix,require-await,no-unused-vars supabase/functions/notify-dispatch/index.ts supabase/functions/register-push-token/index.ts supabase/functions/send-marketing-campaign/index.ts supabase/functions/send-push-notification/index.ts supabase/functions/send-transactional-email/index.ts supabase/functions/send-sms/index.ts
