name: Mobile Build (Capacitor)

# Builds Android (APK + AAB) and iOS archives for releases.
# Runs on version tags (v*) and can be triggered manually.
#
# Required repo secrets (production web bundle + strict preflight):
#   SUPABASE_ACCESS_TOKEN
#   SUPABASE_URL
#   SUPABASE_ANON_KEY
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_PUBLISHABLE_KEY
#   VITE_SUPABASE_PROJECT_ID
#   VITE_STRIPE_PUBLISHABLE_KEY   - browser-safe Stripe key (pk_...), never sk_*
#   VITE_ZIVO_RIDE_APP_URL        - must equal https://ride.zivosmedia.com
#   VITE_ZIVO_SOFTWARE_SUPABASE_URL
#   VITE_ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY
#   ZIVO_DRIVER_SUPABASE_PUBLISHABLE_KEY
#   ZIVO_TRAVEL_SUPABASE_PUBLISHABLE_KEY
#   ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY
#   VITE_VAPID_PUBLIC_KEY         - public browser push key matching Supabase VAPID_PUBLIC_KEY
#
# Required repo secrets (signed Android release):
#   ANDROID_KEYSTORE_BASE64       - base64 of release.keystore
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   GOOGLE_SERVICES_JSON_BASE64   - base64 of android/app/google-services.json
#
# Required repo secrets (signed iOS release):
#   IOS_P12_BASE64                - base64 of distribution .p12
#   IOS_P12_PASSWORD
#   IOS_PROVISIONING_PROFILE_B64  - base64 profile for com.hizovo.app
#   IOS_NOTIFICATION_SERVICE_PROVISIONING_PROFILE_B64
#                                 - base64 profile for the notification extension
#   IOS_TEAM_ID
#
# Release builds fail closed when signing secrets are missing. Debug builds still
# work without store signing so the workflow remains useful before credentials
# are configured.

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      release_type:
        description: "Build type supplied by the release workflow"
        required: true
        type: string
      release_sha:
        description: "Exact commit tagged by release-please"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options: [debug, release]

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ inputs.release_sha || github.ref }}
  cancel-in-progress: true

jobs:
  web-bundle:
    name: Build web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Check browser-safe Stripe build key
        env:
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$VITE_STRIPE_PUBLISHABLE_KEY" ]; then
            echo "VITE_STRIPE_PUBLISHABLE_KEY is required before a mobile web bundle can be built."
            exit 1
          fi
          if [[ "$VITE_STRIPE_PUBLISHABLE_KEY" != pk_* ]]; then
            echo "VITE_STRIPE_PUBLISHABLE_KEY must be a browser-safe publishable key (pk_...); secret keys are forbidden."
            exit 1
          fi

      - name: Check production web release environment
        if: github.event_name == 'push' || inputs.release_type == 'release'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_ZIVO_RIDE_APP_URL: ${{ secrets.VITE_ZIVO_RIDE_APP_URL }}
          VITE_ZIVO_SOFTWARE_SUPABASE_URL: ${{ secrets.VITE_ZIVO_SOFTWARE_SUPABASE_URL }}
          VITE_ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY }}
          ZIVO_DRIVER_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ZIVO_DRIVER_SUPABASE_PUBLISHABLE_KEY }}
          ZIVO_TRAVEL_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ZIVO_TRAVEL_SUPABASE_PUBLISHABLE_KEY }}
          ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_URL SUPABASE_ANON_KEY VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_PROJECT_ID VITE_STRIPE_PUBLISHABLE_KEY VITE_ZIVO_RIDE_APP_URL VITE_ZIVO_SOFTWARE_SUPABASE_URL VITE_ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY ZIVO_DRIVER_SUPABASE_PUBLISHABLE_KEY ZIVO_TRAVEL_SUPABASE_PUBLISHABLE_KEY ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY VITE_VAPID_PUBLIC_KEY; do
            if [ -z "${!name}" ]; then
              echo "$name is required for a production mobile web bundle."
              missing=1
            fi
          done
          if [ "$VITE_ZIVO_RIDE_APP_URL" != "https://ride.zivosmedia.com" ]; then
            echo "VITE_ZIVO_RIDE_APP_URL must equal https://ride.zivosmedia.com exactly."
            missing=1
          fi
          if [[ "$VITE_STRIPE_PUBLISHABLE_KEY" != pk_* ]]; then
            echo "VITE_STRIPE_PUBLISHABLE_KEY must be a browser-safe publishable key (pk_...); secret keys are forbidden."
            missing=1
          fi
          exit "$missing"

      - name: Verify Wallet cash-out tombstones
        if: github.event_name == 'push' || inputs.release_type == 'release'
        run: |
          set -euo pipefail
          cashout_base_url="https://slirphzzwcogdbkeicff.supabase.co/functions/v1"
          cashout_functions=(
            process-withdrawal
            connect-instant-payout
            paypal-payout
            wallet-instant-payout
            stripe-instant-payout
          )

          for slug in "${cashout_functions[@]}"; do
            response_file="$RUNNER_TEMP/${slug}-tombstone.json"
            http_status="$(
              curl --silent --show-error \
                --proto '=https' \
                --tlsv1.2 \
                --connect-timeout 10 \
                --max-time 30 \
                --request POST \
                --header 'user-agent: ZIVO-Release-Gate/1.0' \
                --header 'accept: application/json' \
                --header 'content-type: application/json' \
                --data-binary '' \
                --output "$response_file" \
                --write-out '%{http_code}' \
                "$cashout_base_url/$slug"
            )"

            if [ "$http_status" != "503" ]; then
              echo "$slug must return HTTP 503 from the Wallet cash-out tombstone; received $http_status."
              exit 1
            fi

            node - "$response_file" "$slug" <<'NODE'
          const { readFileSync } = require("node:fs");
          const [responseFile, slug] = process.argv.slice(2);
          let payload;
          try {
            payload = JSON.parse(readFileSync(responseFile, "utf8"));
          } catch {
            console.error(`${slug} returned a non-JSON Wallet cash-out tombstone response.`);
            process.exit(1);
          }
          if (payload?.code !== "wallet_cashout_authority_unavailable") {
            console.error(`${slug} returned the wrong Wallet cash-out tombstone code.`);
            process.exit(1);
          }
          NODE
          done

      - name: Run strict production preflight
        if: github.event_name == 'push' || inputs.release_type == 'release'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_ZIVO_RIDE_APP_URL: ${{ secrets.VITE_ZIVO_RIDE_APP_URL }}
          VITE_ZIVO_SOFTWARE_SUPABASE_URL: ${{ secrets.VITE_ZIVO_SOFTWARE_SUPABASE_URL }}
          VITE_ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY }}
          ZIVO_DRIVER_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ZIVO_DRIVER_SUPABASE_PUBLISHABLE_KEY }}
          ZIVO_TRAVEL_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ZIVO_TRAVEL_SUPABASE_PUBLISHABLE_KEY }}
          ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CHANNEL_OG_FUNCTION_URL: ${{ secrets.CHANNEL_OG_FUNCTION_URL }}
        run: |
          set -euo pipefail
          edge_snapshot="$RUNNER_TEMP/zivo-edge-functions.json"
          npx supabase functions list --project-ref "$VITE_SUPABASE_PROJECT_ID" --output-format json > "$edge_snapshot"
          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$edge_snapshot"
          ZIVO_EDGE_FUNCTIONS_LIVE_SNAPSHOT="$(cat "$edge_snapshot")" \
            npm run deploy:preflight:strict -- --skip-build --skip-type-check

      - name: Build web bundle
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_ZIVO_RIDE_APP_URL: ${{ secrets.VITE_ZIVO_RIDE_APP_URL }}
          VITE_ZIVO_SOFTWARE_SUPABASE_URL: ${{ secrets.VITE_ZIVO_SOFTWARE_SUPABASE_URL }}
          VITE_ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_ZIVO_BUSINESS_CATALOG_URL: ${{ secrets.VITE_ZIVO_BUSINESS_CATALOG_URL }}
        run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: web-dist
          path: dist
          # `dist/.well-known` carries the production universal-link files.
          # upload-artifact excludes dotfiles by default, which would otherwise
          # make both native jobs validate a silently incomplete payload.
          include-hidden-files: true
          retention-days: 7

  android:
    name: Android
    needs: web-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: "temurin"
          java-version: "21"

      - run: npm ci --no-audit --no-fund

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: web-dist
          path: dist

      - name: Sync Capacitor
        run: |
          npx cap sync android
          node scripts/native/check-web-sync.mjs --platform android

      - name: Install Android Firebase config
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] || [ "${RELEASE_TYPE}" = "release" ]; then
            echo "Missing Android Firebase config. Add GOOGLE_SERVICES_JSON_BASE64 from android/app/google-services.json."
            exit 1
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 not set; debug build continues without native Firebase push config."
          fi

      - name: Prepare Android release signing
        if: github.event_name == 'push' || inputs.release_type == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Missing Android release signing secrets. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore

      - name: Build Android (release)
        if: github.event_name == 'push' || inputs.release_type == 'release'
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_ZIVO_KEYSTORE_FILE: app/release.keystore
          ORG_GRADLE_PROJECT_ZIVO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_ZIVO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_ZIVO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease packageReleaseUniversalApk --no-daemon

      - name: Verify Android release optimization and installability
        if: github.event_name == 'push' || inputs.release_type == 'release'
        run: |
          npm run android:optimization:check
          npm run android:installability:check

      - name: Build Android (debug)
        if: github.event_name == 'workflow_dispatch' && inputs.release_type == 'debug'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-artifacts
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          retention-days: 30

  ios:
    name: iOS
    needs: web-bundle
    # The explicit label and toolchain check prevent an older default image from
    # silently producing an App Store-ineligible archive.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Require Xcode 26 and iOS 26 SDK
        shell: bash
        run: |
          set -euo pipefail
          xcode_version="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          ios_sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          xcode_major="${xcode_version%%.*}"
          ios_sdk_major="${ios_sdk_version%%.*}"
          if [ "$xcode_major" -lt 26 ] || [ "$ios_sdk_major" -lt 26 ]; then
            echo "Xcode 26+ with the iOS 26+ SDK is required; found Xcode $xcode_version / iOS SDK $ios_sdk_version."
            exit 1
          fi
          echo "Using Xcode $xcode_version / iOS SDK $ios_sdk_version."

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: web-dist
          path: dist

      - name: Sync Capacitor
        run: |
          npx cap sync ios
          node scripts/native/check-web-sync.mjs --platform ios

      - name: Import signing assets
        if: github.event_name == 'push' || inputs.release_type == 'release'
        env:
          P12_B64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          APP_PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}
          EXTENSION_PROFILE_B64: ${{ secrets.IOS_NOTIFICATION_SERVICE_PROVISIONING_PROFILE_B64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$P12_B64" ] || [ -z "$P12_PASSWORD" ] || [ -z "$APP_PROFILE_B64" ] || [ -z "$EXTENSION_PROFILE_B64" ] || [ -z "$IOS_TEAM_ID" ]; then
            echo "Missing iOS release signing secrets. Add IOS_P12_BASE64, IOS_P12_PASSWORD, IOS_PROVISIONING_PROFILE_B64, IOS_NOTIFICATION_SERVICE_PROVISIONING_PROFILE_B64, and IOS_TEAM_ID."
            exit 1
          fi

          decode_base64() {
            if base64 --help 2>&1 | grep -q -- '--decode'; then
              base64 --decode
            else
              base64 -D
            fi
          }

          install_profile() {
            local encoded="$1"
            local expected_bundle_id="$2"
            local profile_file="$RUNNER_TEMP/${expected_bundle_id}.mobileprovision"
            local profile_plist="$RUNNER_TEMP/${expected_bundle_id}.plist"
            printf '%s' "$encoded" | decode_base64 > "$profile_file"
            security cms -D -i "$profile_file" > "$profile_plist"
            local uuid
            local application_identifier
            local get_task_allow
            uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
            application_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"
            get_task_allow="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$profile_plist")"
            if [ -z "$uuid" ] || [ "$application_identifier" != "$IOS_TEAM_ID.$expected_bundle_id" ] || [ "$get_task_allow" != "false" ]; then
              echo "Provisioning profile is not an App Store profile for $expected_bundle_id."
              exit 1
            fi
            if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$profile_plist" >/dev/null 2>&1 || \
              /usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "$profile_plist" >/dev/null 2>&1; then
              echo "Development, ad hoc, and enterprise profiles are not accepted for $expected_bundle_id."
              exit 1
            fi
            for profiles_dir in \
              "$HOME/Library/MobileDevice/Provisioning Profiles" \
              "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$profiles_dir"
              cp "$profile_file" "$profiles_dir/$uuid.mobileprovision"
            done
            echo "Installed App Store profile for $expected_bundle_id."
          }

          KEYCHAIN="$RUNNER_TEMP/zivo-build.keychain-db"
          security create-keychain -p actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          printf '%s' "$P12_B64" | decode_base64 > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN"
          install_profile "$APP_PROFILE_B64" "com.hizovo.app"
          install_profile "$EXTENSION_PROFILE_B64" "com.hizovo.app.NotificationServiceExtension"

      - name: Build iOS archive
        working-directory: ios/App
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ] || [ "${RELEASE_TYPE}" = "release" ]; then
            xcodebuild \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$RUNNER_TEMP/App.xcarchive" \
              DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
              archive
          else
            xcodebuild \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$RUNNER_TEMP/App.xcarchive" \
              CODE_SIGNING_ALLOWED=NO \
              archive
          fi

      - name: Verify archived iOS payload and extension
        env:
          ZIVO_NATIVE_WEB_ROOT_IOS: ${{ runner.temp }}/App.xcarchive/Products/Applications/App.app/public
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          extension_path="$app_path/PlugIns/NotificationServiceExtension.appex"
          test -d "$app_path"
          test -d "$extension_path"
          node scripts/native/check-web-sync.mjs --platform ios
          if [ "${GITHUB_EVENT_NAME}" = "push" ] || [ "${RELEASE_TYPE}" = "release" ]; then
            codesign --verify --strict "$app_path"
            codesign --verify --strict "$extension_path"
          fi

      - name: Export iOS IPA
        if: github.event_name == 'push' || inputs.release_type == 'release'
        working-directory: ios/App
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-export" \
            -exportOptionsPlist ExportOptions.plist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-archive
          path: |
            ${{ runner.temp }}/App.xcarchive
            ${{ runner.temp }}/ios-export
          retention-days: 30
