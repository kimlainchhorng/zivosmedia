name: Mobile Build (Capacitor)

# Builds Android (APK + AAB) and iOS archives for releases.
# Runs on version tags (v*) and can be triggered manually.
#
# Required repo secrets (signed Android release):
#   ANDROID_KEYSTORE_BASE64       - base64 of release.keystore
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   GOOGLE_SERVICES_JSON_BASE64   - base64 of android/app/google-services.json
#   VITE_VAPID_PUBLIC_KEY         - public browser push key matching Supabase VAPID_PUBLIC_KEY
#
# Required repo secrets (signed iOS release):
#   IOS_P12_BASE64                - base64 of distribution .p12
#   IOS_P12_PASSWORD
#   IOS_PROVISIONING_PROFILE_B64  - base64 of .mobileprovision
#   IOS_TEAM_ID
#
# Release builds fail closed when signing secrets are missing. Debug builds still
# work without store signing so the workflow remains useful before credentials
# are configured.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options: [debug, release]

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-bundle:
    name: Build web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build web bundle
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ] || [ "${RELEASE_TYPE}" = "release" ]; then
            if [ -z "$VITE_VAPID_PUBLIC_KEY" ]; then
              echo "Missing web VAPID public key. Add VITE_VAPID_PUBLIC_KEY and keep it matched to the Supabase VAPID_PUBLIC_KEY secret."
              exit 1
            fi
          fi
          npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: web-dist
          path: dist
          retention-days: 7

  android:
    name: Android
    needs: web-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: "temurin"
          java-version: "21"

      - run: npm ci --no-audit --no-fund

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: web-dist
          path: dist

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Install Android Firebase config
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] || [ "${RELEASE_TYPE}" = "release" ]; then
            echo "Missing Android Firebase config. Add GOOGLE_SERVICES_JSON_BASE64 from android/app/google-services.json."
            exit 1
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 not set; debug build continues without native Firebase push config."
          fi

      - name: Prepare Android release signing
        if: github.event_name == 'push' || inputs.release_type == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Missing Android release signing secrets. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore

      - name: Build Android (release)
        if: github.event_name == 'push' || inputs.release_type == 'release'
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_ZIVO_KEYSTORE_FILE: app/release.keystore
          ORG_GRADLE_PROJECT_ZIVO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_ZIVO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_ZIVO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Build Android (debug)
        if: github.event_name == 'workflow_dispatch' && inputs.release_type == 'debug'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-artifacts
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          retention-days: 30

  ios:
    name: iOS
    needs: web-bundle
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - run: npm ci --no-audit --no-fund

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: web-dist
          path: dist

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Import signing assets
        if: github.event_name == 'push' || inputs.release_type == 'release'
        env:
          P12_B64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -z "$P12_B64" ] || [ -z "$P12_PASSWORD" ] || [ -z "$PROFILE_B64" ] || [ -z "$IOS_TEAM_ID" ]; then
            echo "Missing iOS release signing secrets. Add IOS_P12_BASE64, IOS_P12_PASSWORD, IOS_PROVISIONING_PROFILE_B64, and IOS_TEAM_ID."
            exit 1
          fi
          KEYCHAIN=build.keychain
          security create-keychain -p actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          echo "$P12_B64" | base64 -d > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_B64" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/zivo.mobileprovision"

      - name: Build iOS archive
        working-directory: ios/App
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ] || [ "${RELEASE_TYPE}" = "release" ]; then
            xcodebuild \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$RUNNER_TEMP/App.xcarchive" \
              DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
              archive
          else
            xcodebuild \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$RUNNER_TEMP/App.xcarchive" \
              CODE_SIGNING_ALLOWED=NO \
              archive
          fi

      - name: Export iOS IPA
        if: github.event_name == 'push' || inputs.release_type == 'release'
        working-directory: ios/App
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-export" \
            -exportOptionsPlist ExportOptions.plist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-archive
          path: |
            ${{ runner.temp }}/App.xcarchive
            ${{ runner.temp }}/ios-export
          retention-days: 30
