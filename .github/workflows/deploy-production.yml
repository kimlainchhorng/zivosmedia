name: Deploy Production

# Production deploy is gated by CI success on main.
# This avoids shipping a commit that did not pass the full CI pipeline.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-production-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Netlify production (after CI)
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://myzivo.com

    steps:
      - name: Checkout commit that passed CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Detect deploy-relevant changes
        id: changes
        run: |
          git diff --name-only HEAD^ HEAD | node scripts/deploy/production-deploy-relevance.mjs --github-output "$GITHUB_OUTPUT"

      - name: Skip deploy (no runtime-affecting changes)
        if: steps.changes.outputs.relevant != 'true'
        run: echo "No runtime-affecting files changed in latest commit. Skipping production deployment."

      - name: Set up Node.js
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.relevant == 'true'
        run: npm ci --no-audit --no-fund

      - name: Check browser-safe Stripe production key
        if: steps.changes.outputs.relevant == 'true'
        env:
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$VITE_STRIPE_PUBLISHABLE_KEY" ]; then
            echo "VITE_STRIPE_PUBLISHABLE_KEY is required before a production bundle can be built."
            exit 1
          fi
          if [[ "$VITE_STRIPE_PUBLISHABLE_KEY" != pk_* ]]; then
            echo "VITE_STRIPE_PUBLISHABLE_KEY must be a browser-safe publishable key (pk_...); secret keys are forbidden."
            exit 1
          fi

      - name: Verify Wallet cash-out tombstones
        if: steps.changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          cashout_base_url="https://slirphzzwcogdbkeicff.supabase.co/functions/v1"
          cashout_functions=(
            process-withdrawal
            connect-instant-payout
            paypal-payout
            wallet-instant-payout
            stripe-instant-payout
          )

          for slug in "${cashout_functions[@]}"; do
            response_file="$RUNNER_TEMP/${slug}-tombstone.json"
            http_status="$(
              curl --silent --show-error \
                --proto '=https' \
                --tlsv1.2 \
                --connect-timeout 10 \
                --max-time 30 \
                --request POST \
                --header 'user-agent: ZIVO-Release-Gate/1.0' \
                --header 'accept: application/json' \
                --header 'content-type: application/json' \
                --data-binary '' \
                --output "$response_file" \
                --write-out '%{http_code}' \
                "$cashout_base_url/$slug"
            )"

            if [ "$http_status" != "503" ]; then
              echo "$slug must return HTTP 503 from the Wallet cash-out tombstone; received $http_status."
              exit 1
            fi

            node - "$response_file" "$slug" <<'NODE'
          const { readFileSync } = require("node:fs");
          const [responseFile, slug] = process.argv.slice(2);
          let payload;
          try {
            payload = JSON.parse(readFileSync(responseFile, "utf8"));
          } catch {
            console.error(`${slug} returned a non-JSON Wallet cash-out tombstone response.`);
            process.exit(1);
          }
          if (payload?.code !== "wallet_cashout_authority_unavailable") {
            console.error(`${slug} returned the wrong Wallet cash-out tombstone code.`);
            process.exit(1);
          }
          NODE
          done

      - name: Verify ZIVO Ride production boundary
        if: steps.changes.outputs.relevant == 'true'
        run: npm run qa:zivo-ride-production-boundary

      - name: Production preflight
        id: production-preflight
        if: steps.changes.outputs.relevant == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_ZIVO_RIDE_APP_URL: ${{ secrets.VITE_ZIVO_RIDE_APP_URL }}
          VITE_ZIVO_SOFTWARE_SUPABASE_URL: ${{ secrets.VITE_ZIVO_SOFTWARE_SUPABASE_URL }}
          VITE_ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run deploy:preflight:strict -- --skip-build --skip-type-check

      - name: Upload production preflight reports
        if: steps.changes.outputs.relevant == 'true' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-preflight-${{ github.event.workflow_run.head_sha }}
          path: |
            docs/production-preflight-report.md
            docs/production-preflight-summary.json
            docs/api-readiness-report.md
            docs/database-upgrade-readiness-report.md
            docs/supabase-migration-drift-report.md
            docs/supabase-migration-reconciliation-plan.md
            docs/supabase-migration-reconciliation-candidates.csv
            docs/supabase-migration-reconciliation-repair-draft.sql
            docs/supabase-migration-pending-local-review.csv
            docs/supabase-migration-unmatched-local.csv
            docs/supabase-migration-unmatched-remote.csv
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize production preflight
        if: steps.changes.outputs.relevant == 'true' && always()
        run: node scripts/deploy/render-preflight-step-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Run production release gate
        if: steps.changes.outputs.relevant == 'true'
        run: npm run release:production-gate

      - name: Build production bundle
        if: steps.changes.outputs.relevant == 'true'
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_ZIVO_RIDE_APP_URL: ${{ secrets.VITE_ZIVO_RIDE_APP_URL }}
          VITE_ZIVO_SOFTWARE_SUPABASE_URL: ${{ secrets.VITE_ZIVO_SOFTWARE_SUPABASE_URL }}
          VITE_ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Check Netlify secrets and deploy environment
        if: steps.changes.outputs.relevant == 'true'
        id: netlify-secrets
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ] && npm run deploy:env-check; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_ZIVO_RIDE_APP_URL: ${{ secrets.VITE_ZIVO_RIDE_APP_URL }}

      - name: Fail when Netlify secrets are missing
        if: steps.changes.outputs.relevant == 'true' && steps.netlify-secrets.outputs.available != 'true'
        run: |
          echo "Netlify credentials and a valid production environment, including VITE_ZIVO_RIDE_APP_URL, are required for production deploy."
          exit 1

      - name: Deploy production to Netlify
        if: steps.changes.outputs.relevant == 'true' && steps.netlify-secrets.outputs.available == 'true'
        uses: nwtgck/actions-netlify@d22a32a27c918fe470bbc562e984f80ec48c2668
        with:
          publish-dir: ./dist
          production-branch: main
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Production deploy – ${{ github.event.workflow_run.head_sha }}"
          enable-pull-request-comment: false
          enable-commit-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          VITE_ZIVO_RIDE_APP_URL: ${{ secrets.VITE_ZIVO_RIDE_APP_URL }}
