name: E2E

# Playwright end-to-end tests. Runs the chromium project; the visual project
# stays opt-in via workflow_dispatch since baselines drift easily.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
    inputs:
      project:
        description: 'Playwright project to run'
        required: false
        default: 'chromium'
        type: choice
        options:
          - chromium
          - visual

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (${{ github.event.inputs.project || 'chromium' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E secret preflight
        env:
          QA_TEST_EMAIL: ${{ secrets.QA_TEST_EMAIL }}
          QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_ZIVO_SOFTWARE_SUPABASE_URL: ${{ secrets.VITE_ZIVO_SOFTWARE_SUPABASE_URL }}
          VITE_ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          required=(
            QA_TEST_EMAIL
            QA_TEST_PASSWORD
            VITE_SUPABASE_URL
            VITE_SUPABASE_PUBLISHABLE_KEY
            VITE_SUPABASE_PROJECT_ID
            VITE_ZIVO_SOFTWARE_SUPABASE_URL
            VITE_ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          {
            echo "### E2E secret preflight"
            echo
            if [ "${#missing[@]}" -eq 0 ]; then
              echo "✅ All required E2E secrets are configured."
            else
              echo "⚠️ Missing required GitHub Actions secrets:"
              for name in "${missing[@]}"; do
                echo "- \`$name\`"
              done
              echo
              echo "Configure these under: **Settings → Secrets and variables → Actions**."
              echo "Without QA credentials, authenticated Playwright specs are skipped."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::Missing required E2E GitHub Actions secrets: ${missing[*]}"
          fi

      - name: Run Playwright
        env:
          CI: 'true'
          NODE_OPTIONS: "--max-old-space-size=4096"
          QA_TEST_EMAIL: ${{ secrets.QA_TEST_EMAIL }}
          QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
          E2E_EMAIL: ${{ secrets.QA_TEST_EMAIL }}
          E2E_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_ZIVO_SOFTWARE_SUPABASE_URL: ${{ secrets.VITE_ZIVO_SOFTWARE_SUPABASE_URL }}
          VITE_ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY }}
        run: npx playwright test --project=${{ github.event.inputs.project || 'chromium' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
