name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "ios/**"
      - "capacitor.config.ts"
      - "scripts/native/check-web-sync.mjs"
      - "scripts/native/check-web-sync.test.mjs"
      - "src/hooks/usePushNotifications.ts"
      - "src/main.tsx"
      - "src/test/workflows/native-app-release.test.ts"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "ios/**"
      - "capacitor.config.ts"
      - "scripts/native/check-web-sync.mjs"
      - "scripts/native/check-web-sync.test.mjs"
      - "src/hooks/usePushNotifications.ts"
      - "src/main.tsx"
      - "src/test/workflows/native-app-release.test.ts"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    name: iOS simulator build
    # macos-26 is a documented GitHub-hosted runner label. Keep the explicit
    # toolchain guard below so a future image-label change fails closed instead
    # of silently submitting with an obsolete SDK.
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Require Xcode 26 and iOS 26 SDK
        shell: bash
        run: |
          set -euo pipefail
          xcode_version="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          ios_sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          xcode_major="${xcode_version%%.*}"
          ios_sdk_major="${ios_sdk_version%%.*}"
          if [ "$xcode_major" -lt 26 ] || [ "$ios_sdk_major" -lt 26 ]; then
            echo "Xcode 26+ with the iOS 26+ SDK is required; found Xcode $xcode_version / iOS SDK $ios_sdk_version."
            exit 1
          fi
          echo "Using Xcode $xcode_version / iOS SDK $ios_sdk_version."

      - name: Build and sync iOS web payload
        run: |
          npm run build
          npx cap sync ios
          node scripts/native/check-web-sync.mjs --platform ios

      - name: Validate iOS push entitlement
        run: |
          ENTITLEMENT=$(plutil -extract aps-environment raw -o - ios/App/App/App.entitlements)
          if [ -z "$ENTITLEMENT" ]; then
            echo "aps-environment entitlement missing"
            exit 1
          fi
          echo "aps-environment=$ENTITLEMENT"

      - name: Build iOS app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

  android-build:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and sync Android web payload
        run: |
          npm run build
          npx cap sync android
          node scripts/native/check-web-sync.mjs --platform android

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
