name: Deploy Cloudflare Production

# zivosmedia.com is served by the Cloudflare Worker `zivo`.
# Pushing to main updates GitHub, but the live site updates only after this deploy.
# This workflow runs after CI succeeds on main and publishes the same dist to Cloudflare.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-cloudflare-production-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Cloudflare Worker production
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://zivosmedia.com

    steps:
      - name: Checkout commit that passed CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Detect deploy-relevant changes
        id: changes
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --name-only HEAD^ HEAD | node scripts/deploy/production-deploy-relevance.mjs --github-output "$GITHUB_OUTPUT"
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip deploy (no runtime-affecting changes)
        if: steps.changes.outputs.relevant != 'true'
        run: echo "No runtime-affecting files changed in latest commit. Skipping Cloudflare deployment."

      - name: Set up Node.js
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.relevant == 'true'
        run: npm ci --no-audit --no-fund

      - name: Verify ZIVO Ride production boundary
        if: steps.changes.outputs.relevant == 'true'
        run: npm run qa:zivo-ride-production-boundary

      - name: Check Cloudflare deploy secrets
        if: steps.changes.outputs.relevant == 'true'
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_ACCESS_TOKEN SUPABASE_URL SUPABASE_ANON_KEY VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_PROJECT_ID VITE_ZIVO_RIDE_APP_URL VITE_ZIVO_SOFTWARE_SUPABASE_URL VITE_ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY ZIVO_DRIVER_SUPABASE_PUBLISHABLE_KEY ZIVO_TRAVEL_SUPABASE_PUBLISHABLE_KEY ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "$name is required for Cloudflare production deploy."
              missing=1
            fi
          done
          if [ "$VITE_ZIVO_RIDE_APP_URL" != "https://ride.zivosmedia.com" ]; then
            echo "VITE_ZIVO_RIDE_APP_URL must equal https://ride.zivosmedia.com exactly."
            missing=1
          fi
          exit "$missing"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_ZIVO_RIDE_APP_URL: ${{ secrets.VITE_ZIVO_RIDE_APP_URL }}
          VITE_ZIVO_SOFTWARE_SUPABASE_URL: ${{ secrets.VITE_ZIVO_SOFTWARE_SUPABASE_URL }}
          VITE_ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY }}
          ZIVO_DRIVER_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ZIVO_DRIVER_SUPABASE_PUBLISHABLE_KEY }}
          ZIVO_TRAVEL_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ZIVO_TRAVEL_SUPABASE_PUBLISHABLE_KEY }}
          ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Production preflight
        id: production-preflight
        if: steps.changes.outputs.relevant == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_ZIVO_RIDE_APP_URL: ${{ secrets.VITE_ZIVO_RIDE_APP_URL }}
          VITE_ZIVO_SOFTWARE_SUPABASE_URL: ${{ secrets.VITE_ZIVO_SOFTWARE_SUPABASE_URL }}
          VITE_ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY }}
          ZIVO_DRIVER_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ZIVO_DRIVER_SUPABASE_PUBLISHABLE_KEY }}
          ZIVO_TRAVEL_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ZIVO_TRAVEL_SUPABASE_PUBLISHABLE_KEY }}
          ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run deploy:preflight:strict -- --skip-build --skip-type-check

      - name: Upload production preflight reports
        if: steps.changes.outputs.relevant == 'true' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cloudflare-production-preflight-${{ github.event.workflow_run.head_sha || github.sha }}
          path: |
            docs/production-preflight-report.md
            docs/production-preflight-summary.json
            docs/api-readiness-report.md
            docs/database-upgrade-readiness-report.md
            docs/supabase-migration-drift-report.md
            docs/supabase-migration-reconciliation-plan.md
            docs/supabase-migration-reconciliation-candidates.csv
            docs/supabase-migration-reconciliation-repair-draft.sql
            docs/supabase-migration-pending-local-review.csv
            docs/supabase-migration-unmatched-local.csv
            docs/supabase-migration-unmatched-remote.csv
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize production preflight
        if: steps.changes.outputs.relevant == 'true' && always()
        run: node scripts/deploy/render-preflight-step-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Run production release gate
        if: steps.changes.outputs.relevant == 'true'
        run: npm run release:production-gate

      - name: Build production bundle
        if: steps.changes.outputs.relevant == 'true'
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_ZIVO_RIDE_APP_URL: ${{ secrets.VITE_ZIVO_RIDE_APP_URL }}
          VITE_ZIVO_SOFTWARE_SUPABASE_URL: ${{ secrets.VITE_ZIVO_SOFTWARE_SUPABASE_URL }}
          VITE_ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_ZIVO_SOFTWARE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Deploy Worker to Cloudflare
        if: steps.changes.outputs.relevant == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --keep-vars
