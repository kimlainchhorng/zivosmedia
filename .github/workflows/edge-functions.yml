name: Edge Functions

# Type-check all Supabase Edge Functions with Deno to catch import errors
# and type mismatches before they reach production.

on:
  push:
    branches: [main]
    # GitHub rejects paths + paths-ignore on one event; use negated paths instead.
    paths:
      - "supabase/functions/**"
      - ".github/workflows/edge-functions.yml"
      - "!**/*.md"
      - "!**/*.log"
  pull_request:
    branches: [main]
    # GitHub rejects paths + paths-ignore on one event; use negated paths instead.
    paths:
      - "supabase/functions/**"
      - ".github/workflows/edge-functions.yml"
      - "!**/*.md"
      - "!**/*.log"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deno-check:
    name: Deno type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DENO_DIR: ~/.cache/deno

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('supabase/functions/**/*.ts', 'supabase/functions/**/*.json', 'supabase/functions/**/*.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: Deno type-check (shared deps)
        run: deno check --config supabase/functions/deno.json --frozen supabase/functions/_shared/deps.ts

      - name: Deno type-check (all functions)
        run: |
          set -o pipefail
          find supabase/functions -name "index.ts" -not -path "*/_shared/*" -print0 | sort -z | \
          xargs -0 -n 1 sh -c 'echo "Checking: $1" && deno check --config supabase/functions/deno.json --frozen "$1"' _

      - name: Lint edge functions
        run: deno lint supabase/functions/ --ignore=supabase/functions/_shared/test-utils.ts
