name: Chat + Gesture QA

on:
  pull_request:
    # GitHub rejects paths + paths-ignore on one event; use negated paths instead.
    paths:
      - "src/**"
      - "tests/e2e/**"
      - ".github/workflows/chat-gesture-qa.yml"
      - "!**/*.md"
      - "!**/*.log"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "website/**"
      - "**/*.md"
      - "**/*.log"
      - "booking-*.json"

permissions:
  contents: read

concurrency:
  group: chat-gesture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chat-gesture-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Chat smoke QA
        run: npx playwright test tests/e2e/chat-click-smoke.spec.ts tests/e2e/chat-workflow-smoke.spec.ts
      - name: Gesture and safe-area QA
        run: npx playwright test tests/e2e/post-menu-a11y.spec.ts tests/e2e/swipe-close.spec.ts tests/e2e/safe-area.spec.ts
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chat-gesture-qa-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
